<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忠县消防救援大队心理测试系统 - 数字化平台</title>
    <style>
        :root { --fire: #e63946; --navy: #1d3557; --gold: #ffb703; --bg: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", sans-serif; background: #1a1c2c; min-height: 100vh; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; position: relative; }
        .header { background: linear-gradient(135deg, #b91c1c, #7f1d1d); color: white; padding: 30px; text-align: center; border-bottom: 4px solid var(--gold); }
        .content { padding: 30px; min-height: 500px; }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .info-card { background: #f8fafc; padding: 20px; border-radius: 10px; border-left: 5px solid var(--fire); margin-bottom: 20px; }
        .btn { background: var(--fire); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        .btn:hover { background: #c1121f; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
        
        .q-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: var(--navy); }
        .option { border: 2px solid #eee; padding: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .option:hover { background: #f0f4f8; }
        .option.selected { border-color: var(--fire); background: #fff5f5; font-weight: bold; }
        
        /* 报告图表 */
        .bar-wrap { margin: 10px 0; font-size: 12px; }
        .bar-container { height: 20px; background: #eee; border-radius: 10px; display: flex; overflow: hidden; margin: 5px 0; }
        .bar-l { background: #3b82f6; color: white; padding-left: 10px; display: flex; align-items: center; }
        .bar-r { background: var(--fire); color: white; justify-content: flex-end; padding-right: 10px; display: flex; align-items: center; }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <button style="position:absolute; top:10px; right:10px; background:none; border:none; color:white; opacity:0.3; cursor:pointer;" onclick="openLogin()">管理</button>
    <div class="header">
        <h1>忠县消防救援大队专职消防员招录测评</h1>
        <p>心理风险排查 · 职业性格分析 · 纪律素质考评 (v8.0 修复版)</p>
    </div>

    <div class="content">
        <div id="welcomeScreen" class="screen active">
            <div class="info-card">
                <p><strong>测评说明：</strong>本系统将随机抽取 70 道专业题目，请在 30 分钟内凭借第一直觉完成。严禁刻意掩饰真实想法。</p>
            </div>
            <input type="text" id="uName" class="form-control" placeholder="姓名">
            <input type="text" id="uID" class="form-control" placeholder="18位身份证号" maxlength="18">
            <button class="btn" onclick="startTest()">开始抽取题目</button>
        </div>

        <div id="testScreen" class="screen">
            <div style="text-align:right; font-weight:bold; color:var(--fire); margin-bottom:10px;">⏱️ <span id="timer">30:00</span></div>
            <div style="font-size:14px; color:#666; margin-bottom:10px;">进度：<span id="progress">1</span> / 70</div>
            <div id="qBox"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#999;" onclick="goNav(-1)">上一题</button>
                <button class="btn" id="nextBtn" onclick="goNav(1)">下一题</button>
            </div>
        </div>

        <div id="reportScreen" class="screen">
            <div id="reportArea"></div>
            <button class="btn" style="background:#666; margin-top:20px;" onclick="location.reload()">完成并关闭</button>
        </div>

        <div id="adminScreen" class="screen">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>数据后台 (上限 50 人)</h3>
                <button class="btn" style="width:auto; padding:5px 15px;" onclick="location.reload()">登出</button>
            </div>
            <table class="admin-table">
                <thead><tr><th>姓名</th><th>性格</th><th>纪律</th><th>红线</th><th>掩饰</th><th>日期</th><th>操作</th></tr></thead>
                <tbody id="adminList"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal" onclick="if(event.target==this)this.style.display='none'">
    <div style="background:white; max-width:800px; margin: 20px auto; padding:30px; border-radius:10px; position:relative;">
        <div id="modalContent"></div>
    </div>
</div>

<div id="loginBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:10px; width:300px;">
        <h3>管理员登录</h3>
        <input type="password" id="admPwd" class="form-control" placeholder="输入密码" style="margin-top:15px;">
        <button class="btn" onclick="checkLogin()">登录</button>
    </div>
</div>

<script>
/**
 * 专业题库系统 (每个类别均已扩充，确保抽取不卡死)
 */
const POOL = {
    lie: [
        {q:"我从没在背后说过别人的闲话。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我从没产生过想占公家便宜的念头。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我答应的所有事，无论多难都做到了。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我从未对父母或长官撒过谎。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我犯错时从不找任何理由。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我从未在没有任何监管时闯过红灯。", a:["不符合","不确定","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我读书时从未在考场上有过作弊念头。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我能记住所有我阅读过的规章制度。", a:["不符合","部分","完全"], s:[0,0,1], t:"lie"},
        {q:"我从未对任何人产生过嫉妒心。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"},
        {q:"我从不因为任何私事耽误工作。", a:["不符合","偶尔","完全符合"], s:[0,0,1], t:"lie"}
    ],
    red: [
        {q:"在极端愤怒时，我会产生毁掉眼前一切的冲动。", a:["从不","偶尔","经常"], s:[5,1,0], t:"red"},
        {q:"我觉得活着太累，有时想一走了之。", a:["从不","偶尔","经常"], s:[5,1,0], t:"red"},
        {q:"若有人故意针对我，我会用武力报复。", a:["从不","偶尔","经常"], s:[5,1,0], t:"red"},
        {q:"我有时感觉有人在控制我的思想。", a:["从不","偶尔","经常"], s:[5,0,0], t:"red"},
        {q:"我无法控制自己的脾气，事后常后悔。", a:["从不","偶尔","经常"], s:[5,2,0], t:"red"},
        {q:"我曾有过自残或伤害自己的行为。", a:["从不","偶尔","经常"], s:[5,0,0], t:"red"},
        {q:"我觉得周围的人都想害我。", a:["从不","偶尔","经常"], s:[5,1,0], t:"red"},
        {q:"我曾无故感到极度惊恐，甚至想尖叫。", a:["从不","偶尔","经常"], s:[5,2,0], t:"red"},
        {q:"我无法忍受失败，失败让我产生破坏欲。", a:["从不","偶尔","经常"], s:[5,2,0], t:"red"},
        {q:"我喜欢看血腥或暴力的画面。", a:["反感","中立","喜欢"], s:[5,1,0], t:"red"},
        {q:"我经常失眠，脑子里全是消极念头。", a:["从不","偶尔","经常"], s:[5,2,0], t:"red"},
        {q:"我曾因为一点小挫折就连续消沉数周。", a:["从不","偶尔","经常"], s:[5,2,0], t:"red"},
        {q:"我觉得法律和规定是限制强者的。", a:["反对","中立","赞成"], s:[5,2,0], t:"red"},
        {q:"在密闭空间里，我会产生窒息般的恐惧。", a:["从不","轻微","严重"], s:[5,2,0], t:"red"},
        {q:"我曾经在公共场所与陌生人大打出手。", a:["从不","有过","经常"], s:[5,0,0], t:"red"}
    ],
    disc: [
        {q:"如果上级安排你做最脏最累的活，你会：", a:["拒绝","抱怨着做","标准完成"], s:[0,2,5], t:"disc"},
        {q:"对于叠被子等内务规定，你认为：", a:["没意义","形式主义","磨练意志"], s:[0,2,5], t:"disc"},
        {q:"你对“绝对服从”的看法是：", a:["洗脑","看情况","战斗力保障"], s:[0,2,5], t:"disc"},
        {q:"休息日紧急集合，你会：", a:["装睡","拖延","立刻响应"], s:[0,1,5], t:"disc"},
        {q:"若发现战友违规，你会：", a:["隐瞒","不管","提醒并上报"], s:[0,1,5], t:"disc"},
        {q:"个人利益与集体利益冲突时：", a:["个人优先","纠结","集体优先"], s:[0,2,5], t:"disc"},
        {q:"在没有任何人监督时，你的作风：", a:["散漫","偶尔松懈","始终如一"], s:[0,2,5], t:"disc"},
        {q:"被领导当众批评时，你会：", a:["顶撞","心里不服","反思整改"], s:[0,1,5], t:"disc"},
        {q:"你对规章制度的态度是：", a:["漏洞很多","约束他人","敬畏并遵守"], s:[0,1,5], t:"disc"},
        {q:"执行任务时，你更愿意：", a:["自由发挥","看情况","按标准程序"], s:[0,2,5], t:"disc"}
    ],
    mbti: [
        {q:"休假时，你更愿意：", a:["独处(I)","找朋友聚会(E)"], v:["I","E"], t:"ei"},
        {q:"在陌生现场，你会：", a:["观察环境(I)","主动交流(E)"], v:["I","E"], t:"ei"},
        {q:"执行新器材任务，看重：", a:["具体步骤(S)","设计原理(N)"], v:["S","N"], t:"sn"},
        {q:"描述火场时，你更关注：", a:["具体数据(S)","整体感觉(N)"], v:["S","N"], t:"sn"},
        {q:"处理战友纠纷时，看重：", a:["谁对谁错(T)","谁的感受(F)"], v:["T","F"], t:"tf"},
        {q:"评价战友表现，看重：", a:["最终结果(T)","努力过程(F)"], v:["T","F"], t:"tf"},
        {q:"面对突发演练，你习惯：", a:["按既定计划(J)","随机制宜(P)"], v:["J","P"], t:"jp"},
        {q:"你的生活状态是：", a:["井井有条(J)","比较随性(P)"], v:["J","P"], t:"jp"},
        // 扩充 MBTI 以防数量不足
        {q:"你更喜欢哪种工作方式：", a:["团队协作(E)","独立思考(I)"], v:["E","I"], t:"ei"},
        {q:"你更容易被什么说服：", a:["事实证据(S)","逻辑推理(N)"], v:["S","N"], t:"sn"},
        {q:"做决定时你更倾向于：", a:["理智分析(T)","内心价值观(F)"], v:["T","F"], t:"tf"},
        {q:"去外地执行任务，你会：", a:["提前查好路线(J)","到了再说(P)"], v:["J","P"], t:"jp"},
        {q:"你更喜欢：", a:["结交新朋友(E)","老友小聚(I)"], v:["E","I"], t:"ei"},
        {q:"在会议上你通常：", a:["第一个发言(E)","最后总结(I)"], v:["E","I"], t:"ei"},
        {q:"你更关注：", a:["现在(S)","未来(N)"], v:["S","N"], t:"sn"},
        {q:"学习理论知识时：", a:["喜欢看实例(S)","喜欢看理论(N)"], v:["S","N"], t:"sn"},
        {q:"批评他人时：", a:["直截了当(T)","委婉含蓄(F)"], v:["T","F"], t:"tf"},
        {q:"被误解时你第一反应：", a:["讲道理(T)","感到伤心(F)"], v:["T","F"], t:"tf"},
        {q:"处理文件资料：", a:["分类清晰(J)","堆在一起(P)"], v:["J","P"], t:"jp"},
        {q:"你觉得生活：", a:["需要规划(J)","需要惊喜(P)"], v:["J","P"], t:"jp"},
        {q:"你倾向于：", a:["说出想法(E)","写出想法(I)"], v:["E","I"], t:"ei"},
        {q:"你对细节：", a:["非常敏锐(S)","经常忽略(N)"], v:["S","N"], t:"sn"},
        {q:"你会被：", a:["真理打动(T)","情感打动(F)"], v:["T","F"], t:"tf"},
        {q:"完成任务后：", a:["立刻检查(J)","休息一会儿(P)"], v:["J","P"], t:"jp"},
        {q:"你喜欢：", a:["快节奏(E)","慢节奏(I)"], v:["E","I"], t:"ei"},
        {q:"你觉得世界：", a:["是具体的(S)","是抽象的(N)"], v:["S","N"], t:"sn"},
        {q:"法律应该：", a:["严格无情(T)","慈悲为怀(F)"], v:["T","F"], t:"tf"},
        {q:"你更喜欢：", a:["固定日程(J)","开放性(P)"], v:["J","P"], t:"jp"},
        {q:"你更倾向：", a:["主动加入(E)","被动邀请(I)"], v:["E","I"], t:"ei"},
        {q:"你更看重：", a:["实用性(S)","创意性(N)"], v:["S","N"], t:"sn"}
    ],
    math: Array.from({length:15}, (_,i)=>({q:`计算：${25+i} + ${18-i} × 2 = ?`, a:[(25+i+(18-i)*2), (25+i+(18-i)*2)+2, (25+i+(18-i)*2)-3], ans: (25+i+(18-i)*2), t:"math"}))
};

let activeQS = [], curIdx = 0, answers = [], timer = null, timeLimit = 1800;

/**
 * 分类洗牌抽取，确保总数达到70且不重复
 */
function startTest() {
    const n = document.getElementById('uName').value;
    const id = document.getElementById('uID').value;
    if(!n || id.length < 18) return alert("请填写姓名和18位身份证号");

    activeQS = [];
    activeQS.push(...shuffle(POOL.lie).slice(0, 5));
    activeQS.push(...shuffle(POOL.red).slice(0, 15));
    activeQS.push(...shuffle(POOL.disc).slice(0, 10));
    activeQS.push(...shuffle(POOL.mbti).slice(0, 30));
    activeQS.push(...shuffle(POOL.math).slice(0, 10));

    // 打乱顺序并初始化答案
    activeQS = shuffle(activeQS);
    answers = new Array(activeQS.length).fill(null);

    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('testScreen').classList.add('active');
    renderQ();
    startTimer();
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function renderQ() {
    const q = activeQS[curIdx];
    document.getElementById('progress').innerText = curIdx + 1;
    let html = `<div class="q-text">${q.q}</div>`;
    q.a.forEach((opt, i) => {
        html += `<div class="option ${answers[curIdx] === i ? 'selected' : ''}" onclick="setAns(${i})">${opt}</div>`;
    });
    document.getElementById('qBox').innerHTML = html;
    document.getElementById('nextBtn').innerText = (curIdx === 69) ? "提交试卷" : "下一题";
}

function setAns(i) { answers[curIdx] = i; renderQ(); }

function goNav(dir) {
    if(dir === 1 && answers[curIdx] === null) return alert("请选择后再继续");
    curIdx += dir;
    if(curIdx < 0) curIdx = 0;
    if(curIdx > 69) return submit();
    renderQ();
}

function startTimer() {
    timer = setInterval(() => {
        timeLimit--;
        let m = Math.floor(timeLimit / 60), s = timeLimit % 60;
        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' + s : s}`;
        if(timeLimit <= 0) submit();
    }, 1000);
}

function submit() {
    if(!confirm("确定要提交吗？")) return;
    clearInterval(timer);
    
    // 计算逻辑
    let score = {lie:0, red:0, disc:0, math:0, E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0};
    activeQS.forEach((q, i) => {
        const a = answers[i];
        if(q.t === 'lie') score.lie += q.s[a];
        if(q.t === 'red' && q.s[a] === 0) score.red++;
        if(q.t === 'disc') score.disc += q.s[a];
        if(q.t === 'math' && q.a[a] === q.ans) score.math++;
        if(q.v) score[q.v[a]]++;
    });

    const mbti = (score.E >= score.I ? 'E':'I') + (score.S >= score.N ? 'S':'N') + (score.T >= score.F ? 'T':'F') + (score.J >= score.P ? 'J':'P');
    const finalData = {
        name: document.getElementById('uName').value,
        id: document.getElementById('uID').value,
        mbti, score, date: new Date().toLocaleString()
    };

    // 存储后台 (前50)
    let records = JSON.parse(localStorage.getItem('fire_v8') || '[]');
    records.unshift(finalData);
    if(records.length > 50) records.pop();
    localStorage.setItem('fire_v8', JSON.stringify(records));

    showReport(finalData, 'reportArea');
    document.getElementById('testScreen').classList.remove('active');
    document.getElementById('reportScreen').classList.add('active');
}

function showReport(data, target) {
    const s = data.score;
    const html = `
        <div class="info-card"><h3>${data.name} 的量化报告</h3><p>时间：${data.date}</p></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="info-card"><h4>性格类型：${data.mbti}</h4>
                ${renderBar('E','I',s.E,s.I)} ${renderBar('S','N',s.S,s.N)}
                ${renderBar('T','F',s.T,s.F)} ${renderBar('J','P',s.J,s.P)}
            </div>
            <div class="info-card"><h4>核心指标</h4>
                <p>纪律分：<b style="color:var(--fire)">${s.disc}</b> / 50</p>
                <p>算数分：<b>${s.math}</b> / 10</p>
                <p>风险项：<b style="${s.red>0?'color:red':''}">${s.red} 项触发</b></p>
                <p>可靠度：${s.lie >= 3 ? '异常' : '正常'}</p>
            </div>
        </div>
    `;
    document.getElementById(target).innerHTML = html;
}

function renderBar(l,r,lv,rv) {
    let p = (lv/(lv+rv)*100).toFixed(0);
    return `<div class="bar-wrap">${l} vs ${r}<div class="bar-container"><div class="bar-l" style="width:${p}%">${p}%</div><div class="bar-r" style="width:${100-p}%"></div></div></div>`;
}

// 管理功能
if(!localStorage.getItem('adm_p')) localStorage.setItem('adm_p', '123456');
function openLogin() { document.getElementById('loginBox').style.display='flex'; }
function checkLogin() {
    if(document.getElementById('admPwd').value === localStorage.getItem('adm_p')) {
        document.getElementById('loginBox').style.display='none';
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById('adminScreen').classList.add('active');
        const list = JSON.parse(localStorage.getItem('fire_v8') || '[]');
        document.getElementById('adminList').innerHTML = list.map((r,i)=>`
            <tr><td><a href="#" onclick="view(${i})">${r.name}</a></td><td>${r.mbti}</td><td>${r.score.disc}</td><td>${r.score.red}</td><td>${r.score.lie}</td><td>${r.date.split(' ')[0]}</td><td><button onclick="del(${i})">删</button></td></tr>
        `).join('');
    } else alert("密码错误");
}
function view(i) {
    const list = JSON.parse(localStorage.getItem('fire_v8'));
    showReport(list[i], 'modalContent');
    document.getElementById('modal').style.display='block';
}
function del(i) {
    if(!confirm("确定删除？")) return;
    let list = JSON.parse(localStorage.getItem('fire_v8'));
    list.splice(i, 1);
    localStorage.setItem('fire_v8', JSON.stringify(list));
    checkLogin();
}
</script>
</body>
</html>
